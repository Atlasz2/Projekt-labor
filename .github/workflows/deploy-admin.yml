name: Admin – telepítés (Firebase Hosting)

# Csak kézi indítás (Actions → „Run workflow”): az admin felület élesítése
# tudatos döntés, nem történhet meg egy push mellékhatásaként.
# Szükséges tároló-titkok: FIREBASE_SERVICE_ACCOUNT (a projekt Hosting-
# telepítésre jogosult szolgáltatásfiókjának JSON-kulcsa) és a VITE_* értékek.
# Lépések és sorrend: docs/LAUNCH.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Írd be: ELESITES'
        required: true

jobs:
  deploy:
    if: github.event.inputs.confirm == 'ELESITES'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: projekt-labor-a4b1c
          channelId: live
