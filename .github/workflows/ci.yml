name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ── Admin (React + Vite) ───────────────────────────────────────────────────
  admin:
    name: Admin — lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Unit tests (lefedettséggel)
        run: npm run test:coverage

      - name: Production build
        run: npm run build
        env:
          # Provide dummy values so Vite env references don't throw at build time
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: placeholder
          VITE_FIREBASE_APP_ID: placeholder
          VITE_GOOGLE_MAPS_API_KEY: placeholder

  # ── Cloud Functions (szerveroldali QR-validáció) ──────────────────────────
  functions:
    name: Functions — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (lefedettséggel)
        run: npm run test:coverage

  # ── Firestore security rules (emulátor ellen) ─────────────────────────────
  rules:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java (emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install functions deps (redeem-core alá)
        run: npm --prefix functions ci

      - name: Install rules-test deps
        run: npm --prefix firestore-tests ci

      - name: Rules + redeem-core emulator tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-nagyvazsony "npm --prefix firestore-tests test"

  # ── Flutter (mobile app) ───────────────────────────────────────────────────
  flutter:
    name: Flutter — analyze / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests (lefedettséggel)
        run: flutter test --coverage
